services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: werit
      POSTGRES_PASSWORD: werit
      POSTGRES_DB: werit_connect
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ../../backend
    env_file: ../../.env
    depends_on: [db]
    ports: ["3000:3000"]
volumes:
  dbdata:
